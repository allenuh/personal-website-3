<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · drift</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // Original drift: magenta-to-pink clouds sliding sideways over a plum/wine sky.
    import { runLayered } from './shared/layered.js';
    import { driftFrag } from './shared/drift.js';

    runLayered(document.querySelector('canvas'), driftFrag({
      sky: [[0.06, 0.0, 0.045], [0.208, 0.024, 0.192], [0.396, 0.018, 0.144]],
      body: [0.728, 0.08, 0.4],
      core: [1.0, 0.45, 0.75],
      glow: [1.0, 0.76, 0.89],
    }), { scale: 0.33 });
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
