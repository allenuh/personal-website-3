<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06c · bruise</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // Islands pulled toward purple: indigo-violet pools, magenta mid-tones, and only the
    // densest peaks turning crimson. Higher gamma keeps most of the frame in shadow.
    import { runLayered } from './shared/layered.js';
    import { islandsFrag } from './shared/islands.js';

    runLayered(document.querySelector('canvas'), islandsFrag({
      stops: [
        [0.03, 0.0, 0.07],
        [0.05, 0.25, [0.13, 0.02, 0.28]],
        [0.25, 0.42, [0.29, 0.03, 0.42]],
        [0.42, 0.58, [0.54, 0.04, 0.50]],
        [0.58, 0.78, [0.78, 0.05, 0.42]],
        [0.78, 0.98, [0.86, 0.07, 0.22]],
      ],
      gamma: 2.3,
      speed: 0.8,
      breathe: 0.03,
      shadow: 0.4,
      shadowTint: [0.2, 0.02, 0.3],
    }));
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
