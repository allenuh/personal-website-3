<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · fretboard ghost</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="grain"></div>

  <script type="module">
    // A procedural guitar neck (strings, frets, inlays), double-exposed at two scales,
    // smeared with a noise-steered directional blur and split into RGB, over a hazy
    // magenta field with a pale "head" smudge and a dark mass.
    import { runShader } from './shared/gl.js';
    import { NOISE, PALETTE } from './shared/glsl.js';

    const frag = /* glsl */ `
      precision highp float;
      uniform vec2 u_res;
      uniform float u_time;
      uniform vec2 u_mouse;
      ${NOISE}
      ${PALETTE}

      float line(float d, float w) { return smoothstep(w, 0.0, d); }

      // neck in local space: x along the neck, y across it. returns (wood, light)
      vec2 neck(vec2 p) {
        float wood = smoothstep(0.56, 0.44, abs(p.y));

        float sy = (p.y + 0.38) / 0.76 * 5.0;
        float strings = line(abs(sy - floor(sy + 0.5)), 0.08) * step(-0.5, sy) * step(sy, 5.5);

        float n = p.x * 2.2;
        float frets = line(abs(n - floor(n + 0.5)), 0.07);

        float m = mod(floor(n), 12.0);
        float isDot = step(abs(m - 2.0), 0.5) + step(abs(m - 4.0), 0.5)
                    + step(abs(m - 6.0), 0.5) + step(abs(m - 8.0), 0.5);
        float dots = isDot * line(length(vec2((fract(n) - 0.5) / 2.2, p.y)), 0.09);

        return vec2(wood, wood * (0.35 * strings + 1.1 * frets + 1.2 * dots));
      }

      vec2 exposure(vec2 p, float t) {
        vec2 a = rot(0.42 + 0.03 * sin(t * 0.05)) * (p - vec2(0.5, 0.2)) * 2.0;
        vec2 b = rot(-0.12) * (p - vec2(-0.2, -0.42) + vec2(0.015 * t, 0.0)) * 1.1;
        return neck(a) + 0.3 * neck(b);
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_res;
        vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
        float t = u_time;

        // low-frequency warp, shared by every blur tap
        vec2 w = vec2(fbm(p * 1.1 + vec2(0.0, t * 0.03)), fbm(p * 1.1 + vec2(4.1, 2.3) - t * 0.025)) - 0.5;
        vec2 pw = p + w * 0.35 + (u_mouse - 0.5) * 0.05;

        float ang = 0.3 + w.x * 1.4;
        vec2 dir = vec2(cos(ang), sin(ang));
        vec2 perp = vec2(-dir.y, dir.x);
        float len = 0.2 + 0.06 * sin(t * 0.07) + 0.15 * w.y;
        vec2 ca = dir * 0.016;
        // per-pixel jitter turns tap banding into soft grain
        float jit = hash(gl_FragCoord.xy + fract(t) * 37.0) - 0.5;

        float wood = 0.0;
        vec3 light = vec3(0.0);
        for (int i = 0; i < 14; i++) {
          float k = (float(i) + jit) / 13.0 - 0.5;
          vec2 o = dir * k * len + perp * k * k * 0.06 * sin(float(i) * 2.4);
          vec2 g = exposure(pw + o, t);
          wood += g.x;
          light.g += g.y;
          light.r += exposure(pw + o + ca, t).y;
          light.b += exposure(pw + o - ca, t).y;
        }
        wood /= 14.0;
        light /= 14.0;

        // base haze
        float h = fbm(p * 0.9 + w * 1.5 + vec2(t * 0.01, 0.0));
        float v = 0.62 + 0.7 * (h - 0.5);

        vec2 hp = (p - vec2(-0.38, 0.02) - w * 0.25) * vec2(2.2, 1.5);
        v += 0.35 * exp(-dot(hp, hp) * 2.0);

        float dark = smoothstep(-0.05, 0.5, -p.y * 0.9 + p.x * 0.3 + w.x * 1.1 - 0.1);
        v -= 0.55 * dark;

        vec3 col = loveless(v);
        col *= 1.0 - 0.55 * wood;
        col = screen(col, light * vec3(1.0, 0.5, 0.78) * 1.1);

        vec2 d = uv - 0.5;
        col *= 1.0 - 0.5 * dot(d, d);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    runShader(document.querySelector('canvas'), frag, { scale: 0.5 });
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
