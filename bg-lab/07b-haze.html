<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07b · haze</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // Drift with depth: a big, slow violet cloud layer behind magenta clouds, both sliding
    // diagonally at different speeds. Wider thresholds make the edges hazier.
    import { runLayered } from './shared/layered.js';
    import { driftFrag } from './shared/drift.js';

    runLayered(document.querySelector('canvas'), driftFrag({
      sky: [[0.03, 0.0, 0.06], [0.14, 0.01, 0.22], [0.30, 0.01, 0.13]],
      back: [0.36, 0.02, 0.36],
      body: [0.70, 0.04, 0.36],
      core: [0.90, 0.08, 0.45],
      glow: [0.95, 0.18, 0.42],
      coreMix: 0.6,
      glowMix: 0.45,
      velocity: [0.022, 0.01],
      scale: 1.8,
      lo: 0.44,
      hi: 0.78,
      breathe: 0.15,
    }), { scale: 0.33 });
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
