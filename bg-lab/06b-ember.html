<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06b · ember</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // Islands, darkened: highlights top out at saturated hot magenta instead of pale pink,
    // with a slow breathing zoom and a purple shadow layer drifting over.
    import { runLayered } from './shared/layered.js';
    import { islandsFrag } from './shared/islands.js';

    runLayered(document.querySelector('canvas'), islandsFrag({
      stops: [
        [0.04, 0.0, 0.06],
        [0.05, 0.22, [0.18, 0.02, 0.24]],
        [0.22, 0.36, [0.40, 0.03, 0.34]],
        [0.36, 0.5, [0.68, 0.03, 0.30]],
        [0.5, 0.68, [0.86, 0.06, 0.36]],
        [0.68, 0.95, [0.94, 0.14, 0.50]],
      ],
      breathe: 0.04,
      shadow: 0.55,
      shadowTint: [0.35, 0.05, 0.45],
      speed: 0.9,
    }));
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
