<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · feedback smear</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="grain"></div>

  <script type="module">
    // Ping-pong feedback: each frame the previous image is advected along a curl-noise flow
    // and only partly refreshed from a source image (haze + sliding fretboard), so bright
    // detail leaves long, wet-paint trails instead of just blurring.
    import { getGL, program, fullscreenTriangle, trackPointer, fit, renderTarget, reducedMotion } from './shared/gl.js';
    import { NOISE, PALETTE } from './shared/glsl.js';

    const SCALE = 0.4;

    const advectFrag = /* glsl */ `
      precision highp float;
      uniform sampler2D u_prev;
      uniform vec2 u_res;
      uniform float u_time;
      uniform float u_dt;
      uniform float u_init;
      uniform vec2 u_mouse;
      ${NOISE}
      ${PALETTE}

      vec3 source(vec2 p, float t, out float stamp) {
        vec2 w = vec2(fbm(p * 1.3 + vec2(0.0, t * 0.06)), fbm(p * 1.3 + vec2(3.1, 7.7) - t * 0.05)) - 0.5;
        float f = fbm(p * 1.8 + w * 2.5 + vec2(t * 0.03, 0.0));
        float dark = smoothstep(-0.1, 0.5, -p.y * 0.9 + p.x * 0.3 + w.x * 1.2 - 0.1);
        vec3 c = loveless(0.62 + 0.9 * (f - 0.5) - 0.5 * dark);

        vec2 q = rot(0.42) * (p - vec2(0.4, 0.15) + w * 0.25) * 2.3;
        float band = smoothstep(0.5, 0.4, abs(q.y));
        float sy = (q.y + 0.38) / 0.76 * 5.0;
        float strings = smoothstep(0.15, 0.0, abs(sy - floor(sy + 0.5)));
        float n = q.x * 2.2 + t * 0.25;
        float frets = smoothstep(0.1, 0.0, abs(n - floor(n + 0.5)));
        // the neck only "develops" in drifting patches; elsewhere it's left to the smear
        float reveal = smoothstep(0.4, 0.7, fbm(p * 2.0 + vec2(t * 0.07, -t * 0.05)));
        float lights = band * max(strings * 0.5, frets) * reveal;

        c *= 1.0 - 0.4 * band * reveal;
        c = screen(c, vec3(1.0, 0.55, 0.8) * lights);
        stamp = lights;
        return c;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_res;
        vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
        float t = u_time;

        vec2 fp = p * 1.2 + vec2(t * 0.02, -t * 0.015) + (u_mouse - 0.5) * 0.3;
        float e = 0.02;
        float n0 = fbm(fp);
        vec2 curl = vec2(fbm(fp + vec2(0.0, e)) - n0, n0 - fbm(fp + vec2(e, 0.0))) / e;
        vec2 flow = (curl * 0.003 + vec2(0.0012, -0.0005)) * u_dt;
        flow.x *= u_res.y / u_res.x;

        vec3 prev = texture2D(u_prev, uv - flow).rgb;
        float stamp;
        vec3 src = source(p, t, stamp);
        float rate = 1.0 - pow(1.0 - (0.008 + 0.06 * stamp), u_dt);
        vec3 col = mix(prev, src, max(rate, u_init));

        // dither so tiny 8-bit updates don't stall
        col += (hash(gl_FragCoord.xy + fract(t) * 91.0) - 0.5) / 255.0;
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const displayFrag = /* glsl */ `
      precision highp float;
      uniform sampler2D u_state;
      uniform vec2 u_res;

      void main() {
        vec2 uv = gl_FragCoord.xy / u_res;
        vec2 d = uv - 0.5;
        vec2 off = d * 0.008;
        vec3 col = vec3(texture2D(u_state, uv + off).r, texture2D(u_state, uv).g, texture2D(u_state, uv - off).b);
        col *= 1.0 - 0.55 * dot(d, d);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const canvas = document.querySelector('canvas');
    const gl = getGL(canvas);
    const adv = program(gl, advectFrag);
    const disp = program(gl, displayFrag);
    fullscreenTriangle(gl);
    const pointer = trackPointer();

    let a, b, init;
    let time = 40;

    function step(dt) {
      if (fit(canvas, SCALE) || !a) {
        a = renderTarget(gl, canvas.width, canvas.height);
        b = renderTarget(gl, canvas.width, canvas.height);
        init = 1;
      }
      time += dt / 60;
      const m = pointer();
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.useProgram(adv.prog);
      gl.bindFramebuffer(gl.FRAMEBUFFER, b.fb);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, a.tex);
      gl.uniform1i(adv.u.u_prev, 0);
      gl.uniform2f(adv.u.u_res, canvas.width, canvas.height);
      gl.uniform1f(adv.u.u_time, time);
      gl.uniform1f(adv.u.u_dt, dt);
      gl.uniform1f(adv.u.u_init, init);
      gl.uniform2f(adv.u.u_mouse, m[0], m[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      [a, b] = [b, a];
      init = 0;
    }

    function present() {
      gl.useProgram(disp.prog);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.bindTexture(gl.TEXTURE_2D, a.tex);
      gl.uniform1i(disp.u.u_state, 0);
      gl.uniform2f(disp.u.u_res, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    if (reducedMotion) {
      // settle the smear offline, then hold a still frame
      const settle = () => { for (let i = 0; i < 400; i++) step(1); present(); };
      settle();
      addEventListener('resize', settle);
    } else {
      let last = performance.now();
      requestAnimationFrame(function frame(now) {
        step(Math.min((now - last) / (1000 / 60), 3));
        last = now;
        present();
        requestAnimationFrame(frame);
      });
    }
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
