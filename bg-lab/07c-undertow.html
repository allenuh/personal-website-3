<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07c · undertow</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // Drift rising instead of sliding: crimson smoke climbing slowly through a deep purple
    // to oxblood sky, warp strength breathing so the shapes swell and thin over time.
    import { runLayered } from './shared/layered.js';
    import { driftFrag } from './shared/drift.js';

    runLayered(document.querySelector('canvas'), driftFrag({
      sky: [[0.05, 0.0, 0.03], [0.10, 0.0, 0.16], [0.24, 0.0, 0.10]],
      back: [0.30, 0.01, 0.20],
      body: [0.62, 0.02, 0.20],
      core: [0.86, 0.06, 0.36],
      glow: [0.88, 0.10, 0.55],
      coreMix: 0.6,
      glowMix: 0.45,
      velocity: [0.004, -0.022],
      scale: 2.0,
      lo: 0.45,
      hi: 0.8,
      breathe: 0.25,
    }), { scale: 0.33 });
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
