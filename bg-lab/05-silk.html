<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · silk</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>

  <script type="module">
    // After patriciogv's warp: q warps r, r warps f, and the colour is built by stacking
    // mix() layers keyed on f, |q| and r.x, so each warp stage paints its own swatch.
    import { runLayered } from './shared/layered.js';
    import { NOISE, PERLIN, SWATCHES, fbmFn } from './shared/glsl.js';

    const frag = /* glsl */ `
      precision highp float;
      uniform vec2 u_res;
      uniform float u_time;
      uniform vec2 u_mouse;
      ${NOISE}
      ${PERLIN}
      ${SWATCHES}
      ${fbmFn('warpFbm', { octaves: 6, lacunarity: 2.0, gain: 0.5 })}

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y * 2.4 + (u_mouse - 0.5) * 0.15;
        float t = u_time;

        vec2 q = vec2(warpFbm(st + vec2(0.02 * t, 0.0)), warpFbm(st + vec2(1.0)));
        vec2 r = vec2(warpFbm(st + 1.4 * q + vec2(1.7, 9.2) + 0.06 * t),
                      warpFbm(st + 1.4 * q + vec2(8.3, 2.8) + 0.05 * t));
        float f = warpFbm(st + 1.6 * r);

        vec3 col = mix(RED, PINK, clamp(f * f * 3.2, 0.0, 1.0));
        col = mix(col, PLUM, clamp(length(q) - 0.25, 0.0, 1.0));
        col = mix(col, MAG, clamp(r.x * r.x * 1.6, 0.0, 1.0));
        col *= (f * f * f + 0.6 * f * f + 0.5 * f) * 2.1;

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    runLayered(document.querySelector('canvas'), frag);
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
