<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · fbm warp</title>
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="grain"></div>

  <script type="module">
    // Domain-warped fbm (noise fed into noise, twice), stretched along a diagonal so the
    // folds read as directional smears, then mapped through the Loveless gradient.
    import { runShader } from './shared/gl.js';
    import { NOISE, PALETTE } from './shared/glsl.js';

    const frag = /* glsl */ `
      precision highp float;
      uniform vec2 u_res;
      uniform float u_time;
      uniform vec2 u_mouse;
      ${NOISE}
      ${PALETTE}

      void main() {
        vec2 uv = gl_FragCoord.xy / u_res;
        vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
        p += (u_mouse - 0.5) * 0.04;
        float t = u_time * 0.035;

        vec2 s = rot(-0.5) * p * vec2(0.5, 1.3);
        vec2 q = vec2(fbm(s + vec2(0.0, t)), fbm(s + vec2(5.2, 1.3) - t * 0.7));
        vec2 r = vec2(fbm(s + 2.6 * q + vec2(1.7, 9.2) + t * 0.5),
                      fbm(s + 2.6 * q + vec2(8.3, 2.8) - t * 0.4));
        float f = fbm(s * 0.8 + 3.0 * r);

        // mostly mid-to-bright magenta, like the cover
        float v = 0.5 + 0.55 * smoothstep(0.2, 0.8, f + 0.3 * (q.x - 0.5));

        // dark mass in the lower right, edge broken up by the warp
        float dark = smoothstep(0.05, 0.6, dot(p, normalize(vec2(0.55, -0.8))) + 0.7 * (r.x - 0.5));
        v -= 0.55 * dark;

        // pale bloom on the left, where the face sits on the cover
        vec2 hp = (p - vec2(-0.4, 0.05)) * vec2(1.6, 1.1) + (q - 0.5) * 0.6;
        v += 0.3 * exp(-dot(hp, hp) * 4.0);

        vec3 col = loveless(v);
        col = screen(col, vec3(1.0, 0.6, 0.85) * pow(max(r.y - 0.55, 0.0) * 2.4, 2.5) * 0.5);

        vec2 d = uv - 0.5;
        col *= 1.0 - 0.6 * dot(d, d);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    runShader(document.querySelector('canvas'), frag, { scale: 0.5 });
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
