<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 · CSS haze</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    /*
      No canvas: drifting radial-gradient blobs blended together, plus an SVG
      fretboard pushed through turbulence displacement and an anisotropic blur
      (stdDeviation "x y") so it smears sideways like a long exposure.
    */
    body { background: #6e0838; }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      animation: drift var(--dur, 60s) ease-in-out infinite alternate;
    }

    @keyframes drift {
      to { transform: translate3d(var(--dx, 4vw), var(--dy, -3vh), 0) scale(var(--s, 1.08)) rotate(var(--r, 6deg)); }
    }

    .field {
      width: 140vmax; height: 120vmax; left: -45vmax; top: -55vmax;
      background: radial-gradient(closest-side, #ff3797, #e5167d 45%, rgba(200, 10, 100, 0.6) 70%, transparent);
      --dur: 70s; --dx: 6vw; --dy: 4vh;
    }

    .crimson {
      width: 80vmax; height: 70vmax; right: -30vmax; top: -25vmax;
      background: radial-gradient(closest-side, #e0145c, rgba(190, 10, 70, 0.5) 55%, transparent);
      --dur: 47s; --dx: -5vw; --dy: 6vh; --r: -8deg;
    }

    .head {
      width: 34vmax; height: 56vmax; left: 4vw; top: 14vh;
      background: radial-gradient(closest-side, rgba(255, 170, 215, 0.8), rgba(255, 110, 190, 0.45) 45%, rgba(255, 80, 170, 0.15) 75%, transparent);
      mix-blend-mode: screen;
      --dur: 38s; --dx: 3vw; --dy: -4vh; --s: 1.12;
    }

    .shadow {
      width: 95vmax; height: 70vmax; right: -25vmax; bottom: -35vmax;
      background: radial-gradient(closest-side, #0c0006, #22000f 45%, rgba(40, 0, 20, 0.5) 70%, transparent);
      mix-blend-mode: multiply;
      --dur: 53s; --dx: -6vw; --dy: -3vh; --r: 10deg;
    }

    .shadow-2 {
      width: 60vmax; height: 30vmax; left: -10vmax; bottom: -6vmax;
      background: radial-gradient(closest-side, rgba(20, 0, 10, 0.9), rgba(60, 0, 30, 0.4) 60%, transparent);
      mix-blend-mode: multiply;
      --dur: 61s; --dx: 8vw; --dy: -2vh; --r: -14deg;
    }

    .neck {
      position: absolute;
      left: 22vw; top: 6vh;
      width: 110vw; height: 46vh;
      transform: rotate(-18deg);
      mix-blend-mode: screen;
      opacity: 0.7;
      -webkit-mask-image: radial-gradient(ellipse 55% 60% at 45% 50%, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse 55% 60% at 45% 50%, #000 30%, transparent 75%);
      will-change: transform;
      animation: neck 80s ease-in-out infinite alternate;
    }

    .neck.ghost {
      left: -20vw; top: 40vh;
      width: 90vw; height: 36vh;
      transform: rotate(8deg) scaleX(-1);
      opacity: 0.35;
      animation-duration: 95s;
      animation-direction: alternate-reverse;
    }

    .neck svg { width: 100%; height: 100%; display: block; overflow: visible; }

    @keyframes neck {
      from { translate: 0 0; }
      to { translate: -6vw 3vh; }
    }

    /* the whole stack gets a soft-light wash so the colours sit together */
    .wash {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255, 60, 150, 0.35), rgba(120, 0, 60, 0.4) 60%, rgba(30, 0, 15, 0.6));
      mix-blend-mode: soft-light;
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .neck { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="blob field"></div>
    <div class="blob crimson"></div>
    <div class="neck" data-seed="7"></div>
    <div class="neck ghost" data-seed="3"></div>
    <div class="blob head"></div>
    <div class="blob shadow"></div>
    <div class="blob shadow-2"></div>
    <div class="wash"></div>
  </div>
  <div class="grain"></div>

  <script>
    // Build the fretboard SVG: six strings, frets at real equal-temperament spacing, inlay dots.
    const W = 1000, H = 240;
    const L = W / (1 - 2 ** (-17 / 12));
    const fretX = (n) => L * (1 - 2 ** (-n / 12));

    function fretboard(seed) {
      let s = '';
      for (let n = 0; n <= 17; n++) {
        s += `<rect x="${fretX(n) - 3}" y="18" width="6" height="${H - 36}" fill="#ffb8dc" opacity=".75"/>`;
      }
      for (const n of [3, 5, 7, 9, 15, 17]) {
        s += `<circle cx="${(fretX(n - 1) + fretX(n)) / 2}" cy="${H / 2}" r="10" fill="#ffd6ec"/>`;
      }
      const mid12 = (fretX(11) + fretX(12)) / 2;
      s += `<circle cx="${mid12}" cy="${H / 2 - 44}" r="10" fill="#ffd6ec"/><circle cx="${mid12}" cy="${H / 2 + 44}" r="10" fill="#ffd6ec"/>`;
      for (let i = 0; i < 6; i++) {
        s += `<rect x="-40" y="${36 + i * 33.6}" width="${W + 80}" height="${1.5 + i * 0.5}" fill="#ffe2f1"/>`;
      }
      return `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <filter id="smear${seed}" x="-25%" y="-40%" width="150%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency=".003 .008" numOctaves="2" seed="${seed}" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="45" xChannelSelector="R" yChannelSelector="G" result="d"/>
            <feGaussianBlur in="d" stdDeviation="6 3.5"/>
          </filter>
          <g filter="url(#smear${seed})">${s}</g>
        </svg>`;
    }

    document.querySelectorAll('.neck').forEach((el) => (el.innerHTML = fretboard(el.dataset.seed)));
  </script>
  <script type="module" src="shared/nav.js"></script>
</body>
</html>
