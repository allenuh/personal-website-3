<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · lens</title>
  <link rel="stylesheet" href="layout.css">
  <style>
    /* Dreamy: the container has no CSS box at all. The background shader melts a darker,
       out-of-focus window behind it whose edge wobbles with noise, so the panel seems to
       be part of the image. Sections dissolve in from a blur. */
    .lens {
      width: min(600px, 100%);
      height: min(540px, 100%);
      display: flex;
      flex-direction: column;
      padding: 44px 48px 32px;
    }

    header {
      text-align: center;
    }

    h1 {
      font: italic 400 72px/0.9 var(--serif);
      letter-spacing: -0.01em;
      animation: breathe 9s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 18px rgba(255, 90, 170, 0.35); filter: blur(0); }
      50% { text-shadow: 0 0 34px rgba(255, 90, 170, 0.6); filter: blur(0.4px); }
    }

    header p {
      margin-top: 10px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin: 28px 0 26px;
    }

    nav button {
      color: var(--faint);
      letter-spacing: 0.04em;
      transition: color 0.6s, text-shadow 0.6s;
    }

    nav button:hover {
      color: var(--muted);
    }

    nav [aria-selected="true"] {
      color: var(--ink);
      text-shadow: 0 0 14px rgba(255, 110, 180, 0.8);
    }

    .body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent);
      mask-image: linear-gradient(to bottom, #000 85%, transparent);
    }

    .about {
      text-align: center;
      font-size: 15px;
      max-width: 44ch;
      margin: 0 auto;
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }

    @media (max-width: 640px) {
      .lens { padding: 28px 20px 20px; }
      h1 { font-size: 56px; }
      nav { gap: 16px; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="lens">
      <header>
        <h1>allen</h1>
        <p>software engineering student</p>
      </header>
      <nav role="tablist" aria-label="Sections">
        <button data-tab="about">about</button>
        <button data-tab="experience">experience</button>
        <button data-tab="projects">projects</button>
        <button data-tab="contact">contact</button>
      </nav>
      <div class="body">
        <section data-panel="about"></section>
        <section data-panel="experience"></section>
        <section data-panel="projects"></section>
        <section data-panel="contact"></section>
      </div>
    </main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { fillPanels } from './render.js';
    import { tabs } from './tabs.js';

    const main = document.querySelector('.lens');
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    fillPanels();
    tabs(main, {
      onChange: (name) => {
        if (calm) return;
        main.querySelector(`[data-panel="${name}"]`).animate(
          [{ opacity: 0, filter: 'blur(12px)', transform: 'translateY(6px)' }, { opacity: 1, filter: 'blur(0)', transform: 'none' }],
          { duration: 900, easing: 'cubic-bezier(.2,.7,.2,1)' },
        );
      },
    });
    startBackground(document.querySelector('canvas'), { lens: { el: main, radius: 48 } });
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
