<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 · focus</title>
  <link rel="stylesheet" href="layout.css">
  <style>
    /* Dreamy: the four sections are translucent sheets stacked like layered photographs.
       The front one is in focus; the ones behind fan out, rotate, and fall out of focus
       (depth of field). Clicking a sheet pulls it forward. The stack drifts slowly. */
    .scene {
      width: min(560px, 100%);
      height: min(600px, 100%);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 104px;
    }

    .caption {
      display: flex;
      align-items: baseline;
      gap: 14px;
      text-shadow: 0 1px 14px rgba(12, 0, 6, 0.7);
    }

    h1 {
      font: italic 400 44px/1 var(--serif);
    }

    .caption p {
      color: var(--muted);
    }

    .stack {
      position: relative;
      min-height: 0;
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      to { transform: translate(4px, -6px) rotate(0.4deg); }
    }

    .sheet {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 26px 22px;
      background: rgba(22, 0, 12, 0.55);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255, 170, 210, 0.22);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(8, 0, 4, 0.45);
      transform-origin: 50% 0;
      transition:
        transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1),
        filter 1.1s cubic-bezier(0.2, 0.7, 0.2, 1),
        opacity 1.1s,
        background-color 1.1s,
        border-color 1.1s;
      cursor: pointer;
    }

    /* sheets behind are lighter and pinker so they read as separate prints, not shadows */
    .sheet:not([data-depth="0"]) {
      background-color: rgba(120, 10, 60, 0.42);
      border-color: rgba(255, 170, 210, 0.4);
    }

    .sheet[data-depth="0"] { z-index: 4; cursor: auto; }
    .sheet[data-depth="1"] { z-index: 3; transform: translate(26px, -34px) rotate(2.4deg) scale(0.97); filter: blur(1.5px); opacity: 0.9; }
    .sheet[data-depth="2"] { z-index: 2; transform: translate(-30px, -62px) rotate(-3deg) scale(0.94); filter: blur(3px); opacity: 0.75; }
    .sheet[data-depth="3"] { z-index: 1; transform: translate(38px, -88px) rotate(3.8deg) scale(0.91); filter: blur(4.5px); opacity: 0.6; }

    .sheet-tab {
      align-self: flex-start;
      display: flex;
      gap: 10px;
      font: 11px/1 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
      padding: 4px 0 14px;
    }

    .sheet[data-depth="0"] .sheet-tab {
      color: var(--accent);
    }

    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: none;
    }

    .sheet:not([data-depth="0"]) .sheet-body {
      pointer-events: none;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .stack { animation: none; }
      .sheet { transition: none; }
    }

    @media (max-width: 640px) {
      .scene { gap: 100px; }
      h1 { font-size: 36px; }
      .caption { flex-direction: column; gap: 4px; }
      .sheet { padding: 14px 18px 18px; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <div class="scene">
      <header class="caption">
        <h1>allen</h1>
        <p>software engineering student, University of Waterloo</p>
      </header>
      <div class="stack" role="tablist" aria-label="Sections">
        <article class="sheet" data-sheet="about">
          <button class="sheet-tab" data-tab="about"><span>01</span>about</button>
          <div class="sheet-body" data-panel="about"></div>
        </article>
        <article class="sheet" data-sheet="experience">
          <button class="sheet-tab" data-tab="experience"><span>02</span>experience</button>
          <div class="sheet-body" data-panel="experience"></div>
        </article>
        <article class="sheet" data-sheet="projects">
          <button class="sheet-tab" data-tab="projects"><span>03</span>projects</button>
          <div class="sheet-body" data-panel="projects"></div>
        </article>
        <article class="sheet" data-sheet="contact">
          <button class="sheet-tab" data-tab="contact"><span>04</span>contact</button>
          <div class="sheet-body" data-panel="contact"></div>
        </article>
      </div>
    </div>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { fillPanels } from './render.js';

    // Unlike the other layouts every panel stays visible, so depth replaces show/hide.
    fillPanels();
    const sheets = [...document.querySelectorAll('.sheet')];
    let order = sheets.map((s) => s.dataset.sheet);

    function focus(name) {
      order = [name, ...order.filter((n) => n !== name)];
      for (const s of sheets) {
        const depth = order.indexOf(s.dataset.sheet);
        s.dataset.depth = depth;
        s.querySelector('.sheet-tab').setAttribute('aria-selected', depth === 0);
        s.querySelector('.sheet-body').inert = depth !== 0;
      }
    }

    for (const s of sheets) s.addEventListener('click', () => focus(s.dataset.sheet));
    focus('about');
    startBackground(document.querySelector('canvas'));
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
