<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 · glass</title>
  <link rel="stylesheet" href="layout.css">
  <style>
    /* Minimal: one frosted card, tabbed sections, fixed height so the page never scrolls. */
    .card {
      width: min(560px, 100%);
      height: min(540px, 100%);
      display: flex;
      flex-direction: column;
      padding: 28px 32px 20px;
      background: rgba(14, 0, 8, 0.42);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(10, 0, 6, 0.45);
    }

    h1 {
      font: 500 20px/1.2 var(--sans);
      letter-spacing: -0.01em;
    }

    .card-head p {
      color: var(--muted);
      margin-top: 2px;
    }

    .tabs {
      display: flex;
      gap: 20px;
      margin: 24px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .tabs button {
      position: relative;
      padding-bottom: 10px;
      color: var(--faint);
      transition: color 0.2s;
    }

    .tabs button:hover {
      color: var(--muted);
    }

    .tabs [aria-selected="true"] {
      color: var(--ink);
    }

    .tabs [aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: var(--accent);
    }

    .card-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .card-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font: 11px var(--mono);
      color: var(--faint);
    }

    @media (max-width: 640px) {
      .card { padding: 22px 20px 16px; }
      .tabs { gap: 14px; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="card">
      <header class="card-head">
        <h1>allen</h1>
        <p>software engineering student at University of Waterloo</p>
      </header>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button data-tab="about">about</button>
        <button data-tab="experience">experience</button>
        <button data-tab="projects">projects</button>
        <button data-tab="contact">contact</button>
      </nav>
      <div class="card-body">
        <section data-panel="about"></section>
        <section data-panel="experience"></section>
        <section data-panel="projects"></section>
        <section data-panel="contact"></section>
      </div>
      <footer class="card-foot">
        <span>toronto, on</span>
        <time id="clock"></time>
      </footer>
    </main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { fillPanels, clock } from './render.js';
    import { tabs } from './tabs.js';

    fillPanels();
    tabs(document.querySelector('.card'));
    clock(document.getElementById('clock'));
    startBackground(document.querySelector('canvas'));
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
