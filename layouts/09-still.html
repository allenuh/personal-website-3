<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>09 · still</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="bare.css">
  <style>
    /* 07 with the blurry window grown ~3% past the content on every side (content box
       unchanged), the name as "allen liu", and Kabel used for one element:
       ?bg=lens (default): contact links in Kabel.
       ?bg=halo: the name in Kabel. */

    /* Kabel Book (freeware cut by A. Carr / Fantazia) */
    @font-face {
      font-family: "Kabel";
      src: url("fonts/kabel.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    .still {
      width: min(728px, 100%);
      max-height: 100%;
      overflow: auto;
      scrollbar-width: none;
      padding: 44px 48px;
    }

    .bare .lede {
      max-width: 60ch;
    }

    /* halo: the name is in Kabel */
    [data-halo] .bare h1 {
      font-family: "Kabel", "Futura", "Century Gothic", sans-serif;
      text-transform: lowercase;
      text-shadow: 0 0 14px rgba(255, 90, 170, 0.12);
    }

    /* lens: the name keeps 02's serif and the contact links are in Kabel instead */
    html:not([data-halo]) .bare .links {
      font: 13px "Kabel", "Futura", "Century Gothic", sans-serif;
    }

    html:not([data-halo]) .bare .links a {
      color: #ad0040;
      text-decoration: none;
    }

    html:not([data-halo]) .bare .links a:hover {
      color: #e3248c;
    }

    @media (max-height: 760px) and (min-width: 641px) {
      .still { padding: 26px 48px; }
    }

    @media (max-width: 640px) {
      .still {
        padding: 32px 20px 28px;
        -webkit-mask-image: linear-gradient(to bottom, #000 92%, transparent);
        mask-image: linear-gradient(to bottom, #000 92%, transparent);
      }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="still bare"></main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { bare } from './render.js';

    if (new URLSearchParams(location.search).get('bg') === 'halo') document.documentElement.dataset.halo = '';

    const main = document.querySelector('.still');
    main.innerHTML = bare();
    startBackground(document.querySelector('canvas'), { lens: { el: main, radius: 48, grow: 0.03 }, pointer: 0 });
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
