<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · box</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="bare.css">
  <style>
    /* 03's hairline frame, pulled in to a box about the size
       of 04's window and holding 02's content exactly.
       ?bg=halo (default): clear box over 02's radial darkening.
       ?bg=lens: the shader blurs and darkens precisely the box, sharp edges, no wobble. */
    .box {
      /* 02's 760px measure plus padding */
      width: min(856px, 100%);
      max-height: 100%;
      display: flex;
      border: 1px solid rgba(255, 190, 225, 0.32);
    }

    .box-body {
      flex: 1;
      min-width: 0;
      overflow: auto;
      scrollbar-width: none;
      padding: 40px 47px;
    }

    @media (max-height: 760px) and (min-width: 641px) {
      .box-body { padding: 30px 47px; }
    }

    @media (max-width: 640px) {
      .box-body { padding: 28px 20px 24px; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="box">
      <div class="box-body bare"></div>
    </main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { bare } from './render.js';

    const lens = new URLSearchParams(location.search).get('bg') === 'lens';
    if (!lens) document.documentElement.dataset.halo = '';

    const box = document.querySelector('.box');
    box.querySelector('.box-body').innerHTML = bare();
    startBackground(document.querySelector('canvas'), lens ? { lens: { el: box, radius: 0, soft: 1.5, wobble: 0 } } : {});
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
