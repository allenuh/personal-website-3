<!doctype html>
<html lang="en" data-halo>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · bare</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="bare.css">
  <style>
    /* Minimal, no container at all: everything visible at once, set straight on the
       background. A soft dark halo (not a box) keeps the text legible. */
    .sheet {
      width: min(760px, 100%);
      max-height: 100%;
      overflow: auto;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="sheet bare"></main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { bare } from './render.js';

    document.querySelector('.sheet').innerHTML = bare();
    startBackground(document.querySelector('canvas'));
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
