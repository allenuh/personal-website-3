<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · frame</title>
  <link rel="stylesheet" href="layout.css">
  <style>
    /* Minimal/editorial: a hairline frame inset from the screen edge with registration
       marks at the corners. Content sits in the corners; the middle is left to the
       background, like a mounted print. */
    .frame {
      position: fixed;
      inset: var(--edge);
      display: grid;
      grid-template:
        "tl tr" auto
        ".  . " 1fr
        "bl br" auto / 1fr auto;
      gap: 24px;
      padding: clamp(20px, 3vmin, 36px);
      border: 1px solid rgba(255, 190, 225, 0.32);
      background:
        linear-gradient(to top, rgba(10, 0, 6, 0.6), transparent 55%),
        linear-gradient(to bottom, rgba(10, 0, 6, 0.35), transparent 30%);
      text-shadow: 0 1px 12px rgba(12, 0, 6, 0.6);
    }

    .mark {
      position: absolute;
      width: 13px;
      height: 13px;
      translate: -50% -50%;
      color: var(--accent);
      font: 300 16px/13px var(--sans);
      text-align: center;
      text-shadow: none;
    }

    .mark:nth-of-type(1) { left: 0; top: 0; }
    .mark:nth-of-type(2) { left: 100%; top: 0; }
    .mark:nth-of-type(3) { left: 0; top: 100%; }
    .mark:nth-of-type(4) { left: 100%; top: 100%; }

    .tl { grid-area: tl; }
    .tr { grid-area: tr; }
    .bl { grid-area: bl; max-width: 460px; min-height: 0; }
    .br { grid-area: br; align-self: end; text-align: right; }

    h1 {
      font: 400 48px/1 var(--serif);
    }

    .tl p {
      margin-top: 8px;
      color: var(--muted);
    }

    .tr {
      display: grid;
      gap: 6px;
      justify-items: end;
      align-content: start;
      font: 12px var(--mono);
    }

    .tr button {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--faint);
    }

    .tr button span {
      opacity: 0.6;
    }

    .tr [aria-selected="true"] {
      color: var(--ink);
    }

    .tr [aria-selected="true"]::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--accent);
    }

    .bl section {
      max-height: calc(100vh - 2 * var(--edge) - 220px);
      overflow: auto;
      scrollbar-width: none;
    }

    .br {
      font: 11px/1.7 var(--mono);
      color: var(--faint);
    }

    @media (max-width: 720px) {
      .frame {
        grid-template: "tl" auto "tr" auto "bl" 1fr "br" auto / 1fr;
        gap: 18px;
      }
      .tr { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px 14px; }
      .tr [aria-selected="true"]::before { width: 10px; }
      h1 { font-size: 40px; }
      .bl { align-self: end; }
      .bl section { max-height: none; }
      .br { text-align: left; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="frame">
    <span class="mark" aria-hidden="true">+</span>
    <span class="mark" aria-hidden="true">+</span>
    <span class="mark" aria-hidden="true">+</span>
    <span class="mark" aria-hidden="true">+</span>

    <header class="tl">
      <h1>allen</h1>
      <p>software engineering student<br>University of Waterloo</p>
    </header>

    <nav class="tr" role="tablist" aria-label="Sections">
      <button data-tab="about"><span>01</span>about</button>
      <button data-tab="experience"><span>02</span>experience</button>
      <button data-tab="projects"><span>03</span>projects</button>
      <button data-tab="contact"><span>04</span>contact</button>
    </nav>

    <main class="bl">
      <section data-panel="about"></section>
      <section data-panel="experience"></section>
      <section data-panel="projects"></section>
      <section data-panel="contact"></section>
    </main>

    <footer class="br">
      <div>toronto, on &middot; <time id="clock"></time></div>
      <div>&copy; 2026</div>
    </footer>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { fillPanels, clock } from './render.js';
    import { tabs } from './tabs.js';

    fillPanels();
    tabs(document.querySelector('.frame'));
    clock(document.getElementById('clock'));
    startBackground(document.querySelector('canvas'));
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
