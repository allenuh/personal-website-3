<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 · still</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="bare.css">
  <style>
    /* 02 exactly, sat inside 05's blurry container: the shader melts a darker,
       out-of-focus window behind the content.
       ?bg=lens (default): only that window, like 05.
       ?bg=halo: 02's radial darkening and text shadows as well. */
    .still {
      /* 02's 760px measure plus padding, so the text keeps clear of the melting edge */
      width: min(856px, 100%);
      max-height: 100%;
      overflow: auto;
      scrollbar-width: none;
      padding: 44px 48px;
    }

    @media (max-height: 760px) and (min-width: 641px) {
      .still { padding: 26px 48px; }
    }

    @media (max-width: 640px) {
      .still {
        padding: 32px 20px 28px;
        -webkit-mask-image: linear-gradient(to bottom, #000 92%, transparent);
        mask-image: linear-gradient(to bottom, #000 92%, transparent);
      }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="still bare"></main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { bare } from './render.js';

    if (new URLSearchParams(location.search).get('bg') === 'halo') document.documentElement.dataset.halo = '';

    const main = document.querySelector('.still');
    main.innerHTML = bare();
    startBackground(document.querySelector('canvas'), { lens: { el: main, radius: 48 } });
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
