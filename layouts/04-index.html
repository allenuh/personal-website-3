<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · index</title>
  <link rel="stylesheet" href="layout.css">
  <style>
    /* Minimal/technical: a near-opaque monospace window, numbered index on the left,
       content on the right, the path in the title bar following the open section. */
    .win {
      width: min(840px, 100%);
      height: min(480px, 100%);
      display: grid;
      grid-template-rows: auto 1fr;
      background: rgba(10, 0, 6, 0.74);
      border: 1px solid var(--line);
      border-radius: 4px;
      font: 13px/1.6 var(--mono);
      box-shadow: 0 24px 70px rgba(8, 0, 4, 0.5);
    }

    .bar {
      display: flex;
      justify-content: space-between;
      padding: 9px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--faint);
      font-size: 11px;
    }

    .bar b {
      font-weight: 400;
      color: var(--accent);
    }

    .body {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }

    .side {
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      border-right: 1px solid var(--line);
    }

    h1 {
      font: 500 15px/1.3 var(--mono);
    }

    .side > p {
      color: var(--faint);
      font-size: 12px;
    }

    .side nav {
      display: grid;
      gap: 4px;
      margin-top: 28px;
    }

    .side button {
      display: flex;
      gap: 12px;
      text-align: left;
      color: var(--faint);
    }

    .side button span {
      opacity: 0.55;
    }

    .side [aria-selected="true"] {
      color: var(--ink);
    }

    .side [aria-selected="true"] span {
      color: var(--accent);
      opacity: 1;
    }

    .status {
      margin-top: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .status i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6dffa8;
      box-shadow: 0 0 8px #6dffa8;
    }

    .pane {
      padding: 24px 28px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .pane .xp-when,
    .pane .contact-label {
      font-size: 11px;
    }

    .pane .proj {
      grid-template-columns: 1fr 1fr;
      gap: 20px 24px;
    }

    @media (max-width: 680px) {
      .win { height: 100%; }
      .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 18px; }
      .side nav { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 14px; }
      .status { display: none; }
      .pane .proj { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas class="bg" aria-hidden="true"></canvas>
  <div class="stage">
    <main class="win">
      <div class="bar">
        <span>~/allen/<b id="path">about</b></span>
        <span>toronto <time id="clock"></time></span>
      </div>
      <div class="body">
        <aside class="side">
          <h1>allen</h1>
          <p>swe student, uwaterloo</p>
          <nav role="tablist" aria-label="Sections">
            <button data-tab="about"><span>01</span>about</button>
            <button data-tab="experience"><span>02</span>experience</button>
            <button data-tab="projects"><span>03</span>projects</button>
            <button data-tab="contact"><span>04</span>contact</button>
          </nav>
          <p class="status"><i></i>open to summer 2027</p>
        </aside>
        <div class="pane">
          <section data-panel="about"></section>
          <section data-panel="experience"></section>
          <section data-panel="projects"></section>
          <section data-panel="contact"></section>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { startBackground } from './bg.js';
    import { fillPanels, clock } from './render.js';
    import { tabs } from './tabs.js';

    fillPanels();
    const path = document.getElementById('path');
    tabs(document.querySelector('.win'), { onChange: (name) => (path.textContent = name) });
    clock(document.getElementById('clock'));
    startBackground(document.querySelector('canvas'));
  </script>
  <script type="module" src="nav.js"></script>
</body>
</html>
